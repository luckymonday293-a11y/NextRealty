<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inquiries — Nexora Realty</title>
  <meta name="description" content="Manage buyer inquiries for your property listings." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body>

  <div class="dashboard-shell">
    <div class="sidebar-overlay" data-sidebar-overlay></div>

    <aside class="dashboard-sidebar" data-dashboard-sidebar>
      <div class="dashboard-sidebar-header">
        <a href="../index.html" class="navbar-logo">
          <span class="navbar-logo-mark">N</span>
          Nexora Realty
        </a>
      </div>

      <nav class="dashboard-nav">
        <a href="index.html" class="dashboard-nav-link">
          <span class="dashboard-nav-icon" aria-hidden="true"><svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21v-6"/><path d="M12 21V3"/><path d="M19 21V9"/></svg></span>
          Overview
        </a>
        <a href="properties.html" class="dashboard-nav-link">
          <span class="dashboard-nav-icon" aria-hidden="true"><svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7"/><path d="M5 9v12h14V9"/><path d="M9 21v-7h6v7"/></svg></span>
          My Listings
        </a>
        <a href="add-property.html" class="dashboard-nav-link">
          <span class="dashboard-nav-icon" aria-hidden="true"><svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg></span>
          Add Property
        </a>
        <a href="inquiries.html" class="dashboard-nav-link is-active">
          <span class="dashboard-nav-icon" aria-hidden="true"><svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></span>
          Inquiries
        </a>
        <a href="profile.html" class="dashboard-nav-link">
          <span class="dashboard-nav-icon" aria-hidden="true"><svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg></span>
          Profile
        </a>
      </nav>

      <div class="dashboard-sidebar-footer">
        <div class="dashboard-user-card">
          <div class="dashboard-user-avatar"><span data-dashboard-user-initials></span></div>
          <div>
            <p class="dashboard-user-name" data-dashboard-user-name>&nbsp;</p>
            <p class="dashboard-user-role" data-dashboard-user-role></p>
          </div>
        </div>
        <a href="#" class="dashboard-signout" data-sign-out>Sign Out</a>
      </div>
    </aside>

    <div class="dashboard-main">
      <header class="dashboard-topbar">
        <button class="sidebar-toggle-btn" data-sidebar-toggle aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
        <h1 class="dashboard-page-title">Inquiries</h1>
        <a href="../index.html" class="dashboard-view-site">View Site <svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
      </header>

      <div class="dashboard-content">
        <div class="demo-banner" data-demo-banner hidden>
          You're viewing demo data as <strong>Amaka Chukwu</strong>.
          <a href="../auth/signup.html">Create an account</a> to manage your own listings.
        </div>

        <div class="inquiries-toolbar">
          <p class="results-count" data-inquiries-count>Loading&hellip;</p>
          <div class="form-group">
            <label class="form-label visually-hidden" for="inquiry-filter">Filter by status</label>
            <select class="form-select" id="inquiry-filter">
              <option value="all">All Statuses</option>
              <option value="New">New</option>
              <option value="Contacted">Contacted</option>
              <option value="Closed">Closed</option>
            </select>
          </div>
        </div>

        <div class="inquiries-list" data-inquiries-list></div>

        <div class="empty-state" data-inquiries-empty hidden>
          <div class="empty-state-icon" aria-hidden="true"><svg class="lucide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></div>
          <h3>No inquiries yet</h3>
          <p>When a buyer sends a message about one of your listings, it'll show up here.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/listings.js"></script>
  <script src="../js/inquiries.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
